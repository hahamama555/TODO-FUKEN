
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>47都道府県 81マスゲーム</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#101b3b;
 color:white;
 font-family:-apple-system,BlinkMacSystemFont,sans-serif;
 text-align:center;
}

.app{
 max-width:560px;
 margin:auto;
 padding:10px;
 min-height:100vh;
 display:flex;
 flex-direction:column;
}

h2{
 color:#ffdf75;
 margin:8px 0;
 font-size:22px;
}

.info{
 font-weight:bold;
 margin:8px;
}

#count{
 color:#ffdf75;
 font-size:22px;
}

.grid{
 width:min(94vw,500px);
 aspect-ratio:1;
 margin:auto;
 display:grid;
 grid-template-columns:repeat(9,1fr);
 grid-template-rows:repeat(9,1fr);
 gap:3px;
}

.tile{
 min-width:0;
 min-height:0;
 background:linear-gradient(135deg,#34558b,#17274b);
 border:1px solid #d2a84e;
 border-radius:4px;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:1px;
 overflow:hidden;
 cursor:pointer;
 touch-action:manipulation;
}

.tile span{
 font-size:clamp(7px,2.2vw,12px);
 font-weight:bold;
 overflow-wrap:anywhere;
 line-height:1.15;
}

.tile.star span{
 font-size:clamp(12px,3.5vw,19px);
}

.tile.open{
 background-size:900% 900%;
 background-repeat:no-repeat;
 border:1px solid #ffffff55;
}

.tile.open span{
 display:none;
}

.buttons{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:7px;
 margin:12px 0;
}

button{
 border:0;
 border-radius:9px;
 padding:12px 4px;
 font-size:14px;
 font-weight:bold;
 background:#34558b;
 color:white;
 cursor:pointer;
}

button:active{
 opacity:.7;
}

.primary{
 background:#c18c2c;
 color:#111;
}

.all{
 background:#168c71;
}

.reset{
 background:#873e50;
}

.photo{
 margin:5px;
 font-size:13px;
}

#status{
 font-size:12px;
 color:#d5dcef;
 margin:5px;
}

@media(max-height:650px){
 .app{padding:5px}
 h2{font-size:18px;margin:3px}
 .grid{width:min(90vw,65vh,440px)}
 button{padding:8px 3px;font-size:12px}
}
</style>
</head>

<body>

<div class="app">

<h2>🗾 47都道府県を見つけよう！</h2>
<div>⭐をタップして写真をOPENしよう！</div>

<div class="info">
 OPENしたマス
 <div id="count">0 / 81</div>
</div>

<div class="grid" id="grid"></div>

<div class="buttons">

<button class="primary" onclick="openNext()">
⭐ 次の1マスOPEN
</button>

<button onclick="openRandom()">
🔀 ランダムOPEN
</button>

<button onclick="undo()">
↩ 1マス戻す
</button>

<button class="all" onclick="openAll()">
🎉 全てOPEN
</button>

<button class="reset" onclick="resetBoard()">
⟲ 全81マスリセット
</button>

</div>

<div class="photo">
写真を選択：
<input type="file" id="photo" accept="image/*">
</div>

<div id="status">
写真を選んでスタート！
</div>

</div>

<script>

const prefectures=[
"北海道",
"青森県","岩手県","宮城県","秋田県","山形県","福島県",
"茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県",
"新潟県","富山県","石川県","福井県","山梨県","長野県",
"岐阜県","静岡県","愛知県","三重県",
"滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県",
"鳥取県","島根県","岡山県","広島県","山口県",
"徳島県","香川県","愛媛県","高知県",
"福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県",
"沖縄県"
];

let items=[];
let opened=[];
let photoURL="";

const grid=document.getElementById("grid");
const count=document.getElementById("count");
const status=document.getElementById("status");

function shuffle(array){
 const a=[...array];

 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }

 return a;
}

function createBoard(){

 const stars=new Set(
  shuffle(
   Array.from({length:81},(_,i)=>i)
  ).slice(0,34)
 );

 let p=0;

 items=Array.from({length:81},(_,i)=>{

  if(stars.has(i)){
   return {type:"star",label:"⭐"};
  }

  return {
   type:"prefecture",
   label:prefectures[p++]
  };

 });

 opened=[];

 render();
}

function render(){

 grid.innerHTML="";

 items.forEach((item,i)=>{

  const tile=document.createElement("div");

  tile.className="tile";

  if(item.type==="star"){
   tile.classList.add("star");
  }

  const span=document.createElement("span");
  span.textContent=item.label;

  tile.appendChild(span);

  if(opened.includes(i)){

   tile.classList.add("open");

   if(photoURL){

    const x=(i%9)*12.5;
    const y=Math.floor(i/9)*12.5;

    tile.style.backgroundImage=`url("${photoURL}")`;
    tile.style.backgroundPosition=`${x}% ${y}%`;

   }else{

    tile.style.background="#263b69";

   }
  }

  // マスを直接タップしてOPEN
  tile.addEventListener("click",()=>{
   openTile(i);
  });

  grid.appendChild(tile);

 });

 count.textContent=opened.length+" / 81";

 if(opened.length===81){
  status.textContent="🎉 全81マスOPEN！完成！";
 }else{
  status.textContent=opened.length+"マスOPEN中";
 }

}

function openTile(i){

 if(opened.includes(i))return;

 opened.push(i);

 render();

}

function openNext(){

 const i=items.findIndex((_,i)=>!opened.includes(i));

 if(i!==-1){
  openTile(i);
 }

}

function openRandom(){

 const remaining=items
  .map((_,i)=>i)
  .filter(i=>!opened.includes(i));

 if(remaining.length===0)return;

 const i=remaining[
  Math.floor(Math.random()*remaining.length)
 ];

 openTile(i);

}

// 1マス戻す
function undo(){

 if(opened.length===0)return;

 opened.pop();

 render();

}

// 全てOPEN
function openAll(){

 opened=items.map((_,i)=>i);

 render();

 status.textContent="🎉 全81マスOPEN！完成！";

}

// 全81マスリセット
function resetBoard(){

 createBoard();

 status.textContent="⭐ 新しい配置にしました！";

}

// 写真選択
document.getElementById("photo")
.addEventListener("change",function(e){

 const file=e.target.files[0];

 if(!file)return;

 if(photoURL){
  URL.revokeObjectURL(photoURL);
 }

 photoURL=URL.createObjectURL(file);

 render();

 status.textContent="📷 写真を設定しました！";

});

// 最初のゲーム開始
createBoard();

</script>

</body>
</html>
